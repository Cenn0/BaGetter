name: Helm Chart Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-helm.yml"
      - "deployment templates/chart/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
      - name: Resolve chart dependencies
        run: helm dependency update "deployment templates/chart/bagetter"
      - name: Lint Helm chart
        run: helm lint "deployment templates/chart/bagetter"
      - name: Render Helm templates
        run: helm template bagetter "deployment templates/chart/bagetter" > /tmp/bagetter-rendered.yaml

name: Release (BaGetter fork)

on:
  push:
    tags:
      - 'v*.*.*'

# This independent fork must never publish to upstream Docker Hub,
# nuget.org package IDs or the upstream Helm repository by default.
permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore, build and test
        run: |
          dotnet restore BaGetter.sln
          dotnet build BaGetter.sln --no-restore --configuration Release
          dotnet test BaGetter.sln --no-build --configuration Release

  release-zip:
    name: Publish fork release ZIP
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Publish and archive application
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/BaGetter --configuration Release --output artifacts --property:Version="$version"
          printf '%s\n' "$GITHUB_SHA" > artifacts/ReleaseSha.txt
          (cd artifacts && zip -q -r "../bagetter-$version.zip" .)
      - name: Create GitHub release in this fork
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "bagetter-$version.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BaGetter $version" --verify-tag --generate-notes "${flags[@]}"

  release-ghcr:
    name: Publish versioned fork image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive fork-owned image coordinates
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            Version=${{ steps.image.outputs.version }}

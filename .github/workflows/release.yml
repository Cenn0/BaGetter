name: Release (BaGetter fork)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New SemVer tag, for example v1.2.3 or v1.2.3-rc.1'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

# The fork must never publish upstream NuGet package IDs, Docker Hub
# images or Helm charts. Publishing stays inside this GitHub repository.
permissions:
  contents: read

concurrency:
  group: bagetter-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Verify protected-main source, build and tests
    if: github.repository == 'Cenn0/BaGetter'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, exact main and absence of an existing release
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Expected semantic version vMAJOR.MINOR.PATCH[-prerelease].' >&2; exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$(git rev-parse FETCH_HEAD)"
            if git ls-remote --tags --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo 'Existing tag cannot be reused.' >&2; exit 1
            fi
          else
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing GitHub release.' >&2; exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore, build and test actual solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore BaGetter.sln
          dotnet build BaGetter.sln --no-restore --configuration Release
          dotnet test BaGetter.sln --no-build --configuration Release

  release-ghcr:
    name: Publish tagged fork container to GHCR
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive fork-owned image name and semver
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            Version=${{ steps.image.outputs.version }}

  release-zip:
    name: Create GitHub release with tested application ZIP
    needs: [verify, release-ghcr]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish, archive and hash framework-dependent app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dotnet publish src/BaGetter/BaGetter.csproj --configuration Release --output artifacts --property:Version="$version"
          printf '%s\n' "$GITHUB_SHA" > artifacts/ReleaseSha.txt
          (cd artifacts && zip -q -r "../bagetter-$version.zip" .)
          sha256sum "bagetter-$version.zip" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish release only after both builds succeed
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          flags=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then flags+=(--verify-tag); fi
          if [[ "$version" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "bagetter-$version.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "BaGetter $version (fork)" \
            --generate-notes "${flags[@]}"
      - name: Download published package and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$RELEASE_TAG" --dir published --pattern '*.zip' --pattern 'SHA256SUMS.txt'
          (cd published && sha256sum -c SHA256SUMS.txt)

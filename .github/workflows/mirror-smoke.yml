name: NuGet.org Mirror Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mirror-smoke.yml"
      - "scripts/smoke/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  real-nuget-org-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build BaGetter host
        run: dotnet build BaGetter.sln --configuration Release
      - name: Restore from real nuget.org via BaGetter
        run: bash scripts/smoke/real-nuget-org-mirror.sh
